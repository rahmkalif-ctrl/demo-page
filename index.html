<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Web Development</title>
  
  <!-- CSS Styling starts here -->
  <style>
    body {
      background-color: #f4f7f6; /* Soft, light gray background */
      color: #333333;            /* Dark charcoal text for high contrast */
      font-family: Arial, sans-serif; /* Clean, readable font */
      max-width: 650px;          /* Keeps text lines at a comfortable reading width */
      margin: 50px auto;         /* 50px space on top/bottom, auto-centers left/right */
      padding: 20px;             /* Inner space around the edges for mobile screens */
      line-height: 1.6;          /* Extra vertical space between lines of text */
    }

    h1 {
      color: #2c3e50;            /* Deep navy blue color for the title */
      border-bottom: 2px solid #3498db; /* Subtle blue line underneath the heading */
      padding-bottom: 10px;      /* Gap between text and the bottom line */
    }

    p {
      font-size: 18px;           /* Makes paragraph text slightly larger */
    }
  </style>
  <!-- CSS Styling ends here -->

</head>
<body>

  <h1>Intro to Web Development</h1>
  
  <p>Welcome to our class! In this course, we are learning the fundamentals of building websites, writing clean HTML, and publishing our projects live to the web using GitHub Pages.</p>

</body>
</html>
