<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Web Development</title>
  
  <style>
    body {
      background-color: #f4f7f6;
      color: #333333;
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 15px;
    }

    /* Link Styling */
    a {
      color: #3498db;          /* Bright blue link text */
      font-weight: bold;       /* Bold text to stand out */
      text-decoration: none;   /* Removes default underline */
    }

    a:hover {
      text-decoration: underline; /* Adds underline when hovering with cursor */
    }
  </style>
</head>
<body>

  <h1>Intro to Web Development</h1>
  
  <p>Welcome to our class! In this course, we are learning the fundamentals of building websites, writing clean HTML, and publishing our projects live to the web using GitHub Pages.</p>

  <!-- Your Image Tag -->
  <img src="Plaza_de_Armas,_Arequipa_2006.jpg" alt="Plaza de Armas in Arequipa with cathedral and palm trees">

  <!-- Your New Link -->
  <p>
    Check out my favorite website: 
    <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Visit Wikipedia</a>
  </p>

</body>
</html>
