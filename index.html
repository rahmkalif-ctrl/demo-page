<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Web Development</title>
  
  <style>
    body {
      background-color: #f4f7f6;
      color: #333333;
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    /* Image Styling */
    img {
      max-width: 100%;    /* Ensures image never expands wider than the text area */
      height: auto;        /* Keeps original aspect ratio so image isn't stretched */
      border-radius: 8px;  /* Adds subtle rounded corners */
      margin-top: 15px;    /* Adds vertical spacing above image */
    }
  </style>
</head>
<body>

  <h1>Intro to Web Development</h1>
  
  <p>Welcome to our class! In this course, we are learning the fundamentals of building websites, writing clean HTML, and publishing our projects live to the web using GitHub Pages.</p>

  <!-- HTML Image Tag -->
  <img src="my-photo.jpg" alt="A laptop on a desk showing web code on the screen">

</body>
</html>
